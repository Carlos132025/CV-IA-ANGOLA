<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskableDocGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0256c4" />
      <stop offset="35%" stop-color="#0066d6" />
      <stop offset="70%" stop-color="#008f88" />
      <stop offset="100%" stop-color="#00ab66" />
    </linearGradient>
    <linearGradient id="maskableFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004899" />
      <stop offset="100%" stop-color="#003570" />
    </linearGradient>
    <linearGradient id="bgCanvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
    <filter id="maskableShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0256c4" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Solid safe background that completely fills the canvas -->
  <rect width="512" height="512" fill="url(#bgCanvasGrad)" />

  <!-- Document Card shape with safe inner margin (centered within inner 70% safe area) -->
  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#maskableShadow)">
    <!-- Main document body path with 3 rounded corners and 1 folded corner -->
    <path d="
      M 166 86 
      L 316 86 
      L 366 136 
      L 366 406 
      C 366 422 353 435 337 435 
      L 166 435 
      C 150 435 137 422 137 406 
      L 137 115 
      C 137 99 150 86 166 86 
      Z" 
      fill="url(#maskableDocGrad)" 
    />

    <!-- Dog-ear Fold at top right -->
    <path d="
      M 316 86 
      L 316 122 
      C 316 130 322 136 330 136 
      L 366 136 
      Z" 
      fill="url(#maskableFoldGrad)" 
      opacity="0.95"
    />
    <path d="M 316 86 L 366 136" stroke="rgba(255,255,255,0.4)" stroke-width="2" />

    <!-- White AI Circle in upper portion of the document -->
    <circle cx="251" cy="180" r="54" fill="#f8fafc" />
    <text 
      x="251" 
      y="182" 
      text-anchor="middle" 
      dominant-baseline="central" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="800" 
      font-size="34" 
      fill="#0256c4" 
      letter-spacing="-0.5"
    >AI</text>

    <!-- Neural Network / AI Nodes inside the document (lower portion) -->
    <line x1="206" y1="305" x2="232" y2="330" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="232" y1="330" x2="260" y2="295" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <circle cx="206" cy="305" r="9" fill="#ffffff" />
    <circle cx="260" cy="295" r="11" fill="#ffffff" />
    <circle cx="232" cy="330" r="8" fill="#ffffff" />

    <rect x="195" y="365" width="68" height="5.5" rx="2.75" fill="#ffffff" />
  </g>
</svg>
