<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaDocGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0256c4" />
      <stop offset="35%" stop-color="#0066d6" />
      <stop offset="70%" stop-color="#008f88" />
      <stop offset="100%" stop-color="#00ab66" />
    </linearGradient>
    <linearGradient id="pwaFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004899" />
      <stop offset="100%" stop-color="#003570" />
    </linearGradient>
    <filter id="pwaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0256c4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean neutral canvas / background with soft safe padding -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />
  
  <!-- Subtle gradient accent circle for depth -->
  <circle cx="256" cy="256" r="236" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Document Card shape with Folded Top-Right Corner -->
  <g filter="url(#pwaShadow)">
    <!-- Main document body path with 3 rounded corners and 1 folded corner -->
    <path d="
      M 166 86 
      L 316 86 
      L 366 136 
      L 366 406 
      C 366 422 353 435 337 435 
      L 166 435 
      C 150 435 137 422 137 406 
      L 137 115 
      C 137 99 150 86 166 86 
      Z" 
      fill="url(#pwaDocGrad)" 
    />

    <!-- Dog-ear Fold at top right -->
    <path d="
      M 316 86 
      L 316 122 
      C 316 130 322 136 330 136 
      L 366 136 
      Z" 
      fill="url(#pwaFoldGrad)" 
      opacity="0.95"
    />
    <path d="M 316 86 L 366 136" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  </g>

  <!-- White AI Circle in upper portion of the document -->
  <circle cx="251" cy="180" r="54" fill="#f8fafc" />
  <text 
    x="251" 
    y="182" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="800" 
    font-size="34" 
    fill="#0256c4" 
    letter-spacing="-0.5"
  >AI</text>

  <!-- Neural Network / AI Nodes inside the document (lower portion) -->
  <!-- Connecting Lines -->
  <line x1="206" y1="305" x2="232" y2="330" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="232" y1="330" x2="260" y2="295" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Node Circles -->
  <circle cx="206" cy="305" r="9" fill="#ffffff" />
  <circle cx="260" cy="295" r="11" fill="#ffffff" />
  <circle cx="232" cy="330" r="8" fill="#ffffff" />

  <!-- Horizontal baseline bar -->
  <rect x="195" y="365" width="68" height="5.5" rx="2.75" fill="#ffffff" />
</svg>
