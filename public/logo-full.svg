<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="540" height="240">
  <defs>
    <linearGradient id="fullDocGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0256c4" />
      <stop offset="35%" stop-color="#0066d6" />
      <stop offset="70%" stop-color="#008f88" />
      <stop offset="100%" stop-color="#00ab66" />
    </linearGradient>
    <linearGradient id="fullFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004899" />
      <stop offset="100%" stop-color="#003570" />
    </linearGradient>
    <filter id="fullShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0256c4" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left Side: Document Icon -->
  <g transform="translate(18, 16)" filter="url(#fullShadow)">
    <!-- Document Body -->
    <path d="
      M 16 12 
      L 74 12 
      L 98 36 
      L 98 184 
      C 98 193 91 200 82 200 
      L 16 200 
      C 7 200 0 193 0 184 
      L 0 28 
      C 0 19 7 12 16 12 
      Z" 
      fill="url(#fullDocGrad)" 
    />

    <!-- Dog-ear fold top-right -->
    <path d="
      M 74 12 
      L 74 30 
      C 74 34 78 36 82 36 
      L 98 36 
      Z" 
      fill="url(#fullFoldGrad)" 
      opacity="0.95"
    />
    <path d="M 74 12 L 98 36" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

    <!-- AI Circle at top -->
    <circle cx="49" cy="65" r="28" fill="#f8fafc" />
    <text 
      x="49" 
      y="66" 
      text-anchor="middle" 
      dominant-baseline="central" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="800" 
      font-size="18" 
      fill="#0256c4" 
      letter-spacing="-0.3"
    >AI</text>

    <!-- AI Network nodes at bottom -->
    <line x1="28" y1="135" x2="42" y2="148" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="42" y1="148" x2="57" y2="129" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="28" cy="135" r="5" fill="#ffffff" />
    <circle cx="57" cy="129" r="6" fill="#ffffff" />
    <circle cx="42" cy="148" r="4.5" fill="#ffffff" />

    <!-- Horizontal baseline -->
    <rect x="23" y="166" width="38" height="3" rx="1.5" fill="#ffffff" />
  </g>

  <!-- Right Side: Brand Typography & Tech Graphics -->
  <g transform="translate(142, 0)">
    <!-- Top Row: "CV [Pulse Wave] IA" -->
    <!-- CV Text -->
    <text 
      x="0" 
      y="90" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="800" 
      font-size="64" 
      fill="#1d4ed8" 
      letter-spacing="-1"
    >CV</text>

    <!-- Teal Heartbeat Pulse Waveform -->
    <path 
      d="M 102 62 L 122 62 L 132 46 L 144 88 L 158 62 L 174 62" 
      fill="none" 
      stroke="#0d9488" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- IA Text -->
    <text 
      x="184" 
      y="90" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="800" 
      font-size="64" 
      fill="#1d4ed8" 
      letter-spacing="-1"
    >IA</text>

    <!-- Middle Row: "ANG [Tech Emblem] LA" -->
    <!-- ANG Text -->
    <text 
      x="0" 
      y="152" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="800" 
      font-size="44" 
      fill="#1e293b" 
      letter-spacing="1"
    >ANG</text>

    <!-- Tech Emblem replacing 'O' in ANGOLA -->
    <g transform="translate(144, 137)">
      <!-- Outer circular ring with nodes -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#1e293b" stroke-width="3" />
      
      <!-- 6 perimeter dots -->
      <circle cx="0" cy="-22" r="3.5" fill="#0d9488" />
      <circle cx="19" cy="-11" r="3.5" fill="#0d9488" />
      <circle cx="19" cy="11" r="3.5" fill="#0d9488" />
      <circle cx="0" cy="22" r="3.5" fill="#0d9488" />
      <circle cx="-19" cy="11" r="3.5" fill="#0d9488" />
      <circle cx="-19" cy="-11" r="3.5" fill="#0d9488" />

      <!-- Center Teal Chevron / House-arrow icon -->
      <path 
        d="M 0 -10 L 10 0 L 10 9 C 10 10.5 8.5 11.5 7 11.5 L -7 11.5 C -8.5 11.5 -10 10.5 -10 9 L -10 0 Z" 
        fill="#0d9488" 
      />
    </g>

    <!-- LA Text -->
    <text 
      x="172" 
      y="152" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="800" 
      font-size="44" 
      fill="#1e293b" 
      letter-spacing="1"
    >LA</text>

    <!-- Subtitle: CURRÍCULO PROFISSIONAL COM IA -->
    <text 
      x="0" 
      y="190" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="700" 
      font-size="14" 
      fill="#475569" 
      letter-spacing="2.2"
    >CURRÍCULO PROFISSIONAL COM IA</text>
  </g>
</svg>
